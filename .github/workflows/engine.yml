name: engine

# The gate the plan asks for: a drop in the import score fails the build
# rather than being noticed later. The engine has no runtime dependencies,
# so the only install here is the type checker.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The job reads the repository and nothing else: no token that could write to it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # Pinned by commit, so that a tag moved later cannot change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install the type checker
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Import accuracy against the fixture corpus
        run: node --experimental-strip-types --no-warnings packages/assess/src/cli/index.ts score fixtures/standard-format

      - name: Speed on a 500-question bank
        run: node --experimental-strip-types --no-warnings packages/assess/src/cli/index.ts perf --count 500
