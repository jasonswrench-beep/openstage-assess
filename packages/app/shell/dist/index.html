<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>OpenAssess</title>
<style>
  :root { --bg: #f4f6f9; --text: #1c2128; --muted: #566170; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14171c; --text: #e6e9ee; --muted: #a0aab8; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { text-align: center; padding: 24px; max-width: 32rem; }
  h1 { font-size: 1.4rem; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>OpenAssess</h1>
  <p id="note" role="status">Starting…</p>
</main>
</body>
</html>
