[package]
name = "openassess-shell"
version = "0.1.0"
description = "The OpenAssess window: a Tauri shell around the app's local server"
authors = ["Jason S. Wrench"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# The system's Save dialog, for a file the window is asked to download. Nothing in the page can call it: the shell shows it
# when the window starts a download, which is the one place a person asks for a file to be saved.
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.16", default-features = false }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
