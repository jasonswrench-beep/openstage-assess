<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>OpenAssess: the library is open elsewhere</title>
<link rel="stylesheet" href="/openstage-ui.css">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
</head>
<body>
<main id="main" tabindex="-1">
<h1>This library is already open</h1>
<p>Another copy of OpenAssess has this library open<span id="since"></span>. Two copies on one library can write over each other's
work without a word, so this copy has not opened it.</p>
<p id="where"></p>
<p>Go to the other OpenAssess window and carry on there. Or close it, and then choose Try again here.</p>
<p><button type="button" class="primary" id="try-again">Try again</button></p>
<div id="status" class="toast" role="status" aria-live="polite"></div>
</main>
<script type="module" src="/in-use.js"></script>
</body>
</html>
